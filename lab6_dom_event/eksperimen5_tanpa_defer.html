<html lang="id">
<head>

  <title>Eksperimen 5 — Script tanpa defer</title>

  <!-- Script dimuat di <head> TANPA defer: dijalankan sebelum <body> diparsing -->

</head>
<body>
  <header><h1 id="judul">Eksperimen 5: tanpa defer</h1></header>
  <main>
    <section class="kartu">
      <p id="pesan">Belum ada tindakan.</p>
      <button id="tombolAksi" type="button">Klik Saya</button>
      <p>Buka Console (F12). Tombol ini tidak akan berfungsi.</p>
    </section>
  </main>
</body>
</html>
